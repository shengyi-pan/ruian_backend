version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruian-backend
    ports:
      - "8000:8000"
    volumes:
      # 挂载配置文件，方便修改配置而无需重建镜像
      - ./config.yaml:/app/config.yaml:ro
      # 挂载上传目录，确保数据持久化
      - ./uploads:/app/uploads
    environment:
      # 可以在这里设置环境变量（如果需要）
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import sys; try: urllib.request.urlopen('http://localhost:8000/health', timeout=5).close(); sys.exit(0); except Exception: sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

